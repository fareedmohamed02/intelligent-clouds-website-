<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none" role="img">
  <title>Multi-region disaster recovery</title>
  <rect width="640" height="280" rx="16" fill="#EEF3F8"/>
  <text x="24" y="36" fill="#6B7A8C" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="0.12em">DISASTER RECOVERY</text>
  <rect x="40" y="64" width="220" height="180" rx="14" fill="#FFFFFF" stroke="#04275F" stroke-width="1.75"/>
  <text x="60" y="92" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="0.12em">REGION A - ACTIVE</text>
  <text x="60" y="120" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Primary estate</text>
  <rect x="60" y="140" width="180" height="28" rx="8" fill="#D9EAF8"/>
  <text x="72" y="159" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">Compute / data / identity</text>
  <rect x="60" y="180" width="140" height="28" rx="8" fill="#04275F" fill-opacity="0.08"/>
  <text x="72" y="199" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">Backups / PITR / ASR</text>
  <text x="60" y="228" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">RPO / RTO owned</text>
  <rect x="380" y="64" width="220" height="180" rx="14" fill="#FFFFFF" stroke="#438BD8" stroke-width="1.75"/>
  <text x="400" y="92" fill="#438BD8" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="0.12em">REGION B - STANDBY</text>
  <text x="400" y="120" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Warm secondary</text>
  <rect x="400" y="140" width="180" height="28" rx="8" fill="#D9EAF8"/>
  <text x="412" y="159" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">Replicated data plane</text>
  <rect x="400" y="180" width="140" height="28" rx="8" fill="#F26A13" fill-opacity="0.12"/>
  <text x="412" y="199" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">Drill-ready cutover</text>
  <text x="400" y="228" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">Failover tested</text>
  <path d="M260 130H380" stroke="#F26A13" stroke-width="2.5"/>
  <path d="M380 170H260" stroke="#04275F" stroke-width="1.75" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <text x="320" y="118" text-anchor="middle" fill="#F26A13" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">replicate</text>
  <text x="320" y="192" text-anchor="middle" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">failover</text>
</svg>
