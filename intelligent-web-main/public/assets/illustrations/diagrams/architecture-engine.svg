<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Architecture Engine</title>
  <desc id="archDesc">Conceptual infrastructure visualization: cloud envelope, layered peak, AWS Azure Kubernetes nodes</desc>
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E8F2FB"/>
    </linearGradient>
    <linearGradient id="archPlateA" x1="180" y1="90" x2="260" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A90E2"/><stop offset="100%" stop-color="#0A2A5C"/>
    </linearGradient>
    <linearGradient id="archPlateB" x1="230" y1="100" x2="310" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B7FD4"/><stop offset="100%" stop-color="#071A3D"/>
    </linearGradient>
    <linearGradient id="archPlateC" x1="280" y1="110" x2="340" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D63BD"/><stop offset="100%" stop-color="#061433"/>
    </linearGradient>
    <pattern id="archGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#04275F" fill-opacity="0.08"/>
    </pattern>
    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="560" height="420" rx="20" fill="url(#archBg)"/>
  <rect width="560" height="420" rx="20" fill="url(#archGrid)"/>
  <rect x="1" y="1" width="558" height="418" rx="19" stroke="#E4EAF1"/>

  <text x="28" y="36" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="0.12em">ARCHITECTURE_ENGINE</text>
  <circle cx="520" cy="30" r="4" fill="#0F766E">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="456" y="34" fill="#0F766E" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">HEALTHY</text>

  <!-- Cloud envelope -->
  <path fill="#FFFFFF" stroke="#5BA3E0" stroke-width="2.5" stroke-linejoin="round"
    d="M110 250
       C110 250 110 250 110 250
       L450 250
       C478 250 492 228 492 204
       C492 172 468 150 436 146
       C440 108 410 80 370 80
       C354 80 340 86 328 96
       C312 64 278 46 240 46
       C190 46 152 78 144 120
       C114 124 92 150 92 182
       C92 220 110 250 110 250 Z"/>

  <!-- Layered peak -->
  <path fill="url(#archPlateA)" d="M200 250 L250 120 L290 120 L250 250 Z"/>
  <path fill="url(#archPlateB)" d="M240 250 L280 130 L320 130 L295 250 Z"/>
  <path fill="url(#archPlateC)" d="M285 250 L315 145 L350 145 L330 250 Z"/>
  <path fill="#071A3D" opacity="0.9" d="M300 250 L325 170 L350 170 L330 250 Z"/>
  <path fill="#F26A13" filter="url(#archGlow)" d="M250 120 L270 78 L290 120 Z">
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </path>
  <path stroke="#050E22" stroke-width="2" d="M250 122 L240 250 M290 125 L280 250"/>

  <!-- Connection lines -->
  <path id="archL1" d="M160 250 C160 290 120 300 100 330" stroke="#2D63BD" stroke-width="1.75" stroke-dasharray="4 4"/>
  <path id="archL2" d="M280 250 V330" stroke="#2D63BD" stroke-width="1.75" stroke-dasharray="4 4"/>
  <path id="archL3" d="M400 250 C400 290 440 300 460 330" stroke="#2D63BD" stroke-width="1.75" stroke-dasharray="4 4"/>

  <!-- Moving particles -->
  <circle r="3" fill="#F26A13">
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#archL1"/></animateMotion>
  </circle>
  <circle r="3" fill="#438BD8">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.4s"><mpath href="#archL2"/></animateMotion>
  </circle>
  <circle r="3" fill="#F26A13">
    <animateMotion dur="3.4s" repeatCount="indefinite" begin="0.8s"><mpath href="#archL3"/></animateMotion>
  </circle>

  <!-- Infra nodes -->
  <g>
    <rect x="52" y="330" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#E4EAF1"/>
    <text x="84" y="355" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">AWS</text>
  </g>
  <g>
    <rect x="232" y="330" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#E4EAF1"/>
    <text x="254" y="355" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">AZURE</text>
  </g>
  <g>
    <rect x="412" y="330" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#E4EAF1"/>
    <text x="440" y="355" fill="#04275F" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="13">K8S</text>
  </g>

  <text x="28" y="400" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">CONCEPTUAL VISUALIZATION  /  NOT LIVE INFRASTRUCTURE</text>
</svg>
