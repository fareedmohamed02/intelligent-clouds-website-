<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none" role="img" aria-labelledby="obsTitle">
  <title id="obsTitle">Conceptual observability visualization</title>
  <rect width="640" height="280" rx="16" fill="#FFFFFF" stroke="#E4EAF1"/>
  <text x="24" y="30" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="0.1em">CONCEPTUAL VISUALIZATION</text>
  <circle cx="596" cy="24" r="4" fill="#0F766E"/>
  <text x="532" y="28" fill="#0F766E" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">HEALTHY</text>

  <!-- KPI cards -->
  <rect x="24" y="52" width="140" height="72" rx="10" fill="#F8FAFC" stroke="#E4EAF1"/>
  <text x="40" y="78" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">CPU</text>
  <text x="40" y="104" fill="#0B1730" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="26">42%</text>

  <rect x="176" y="52" width="140" height="72" rx="10" fill="#F8FAFC" stroke="#E4EAF1"/>
  <text x="192" y="78" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">MEMORY</text>
  <text x="192" y="104" fill="#0B1730" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="26">61%</text>

  <rect x="328" y="52" width="140" height="72" rx="10" fill="#F8FAFC" stroke="#E4EAF1"/>
  <text x="344" y="78" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">LATENCY</text>
  <text x="344" y="104" fill="#0B1730" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="26">42ms</text>

  <rect x="480" y="52" width="136" height="72" rx="10" fill="#F8FAFC" stroke="#E4EAF1"/>
  <text x="496" y="78" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="11">ERROR RATE</text>
  <text x="496" y="104" fill="#0F766E" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="26">0.02%</text>

  <!-- Chart -->
  <rect x="24" y="144" width="592" height="104" rx="10" fill="#F8FAFC" stroke="#E4EAF1"/>
  <path d="M48 220 C100 200 140 170 190 190 S280 240 340 200 S430 150 490 180 S560 210 600 170" stroke="#438BD8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M48 230 C110 220 150 200 200 210 S290 250 350 220 S440 180 500 200 S560 220 600 190" stroke="#F26A13" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <text x="40" y="164" fill="#5F6B7A" font-family="Ubuntu, ui-sans-serif, system-ui, sans-serif" font-size="10">METRICS  /  LOGS  /  TRACES</text>
</svg>
