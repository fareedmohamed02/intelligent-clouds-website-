    <rect x="96" y="296" width="288" height="44" rx="10" stroke="#5BA3E0" stroke-width="1.5" fill="#0B2248"/>
    <text x="198" y="323" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">NETWORK</text>
