<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none" role="img" aria-labelledby="netTitle">
  <title id="netTitle">From infrastructure to intelligence</title>
  <rect width="640" height="320" rx="16" fill="#F8FAFC" stroke="#E4EAF1"/>
  <text x="24" y="32" fill="#5F6B7A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.1em">INFRASTRUCTURE ’ INTELLIGENCE</text>

  <!-- Nodes -->
  <g id="nodes">
    <circle cx="80" cy="90" r="8" fill="#FFFFFF" stroke="#2D63BD" stroke-width="2"/>
    <circle cx="200" cy="70" r="8" fill="#FFFFFF" stroke="#2D63BD" stroke-width="2"/>
    <circle cx="320" cy="120" r="10" fill="#F26A13"/>
    <circle cx="440" cy="70" r="8" fill="#FFFFFF" stroke="#2D63BD" stroke-width="2"/>
    <circle cx="560" cy="100" r="8" fill="#FFFFFF" stroke="#2D63BD" stroke-width="2"/>
    <circle cx="160" cy="200" r="8" fill="#FFFFFF" stroke="#438BD8" stroke-width="2"/>
    <circle cx="300" cy="230" r="8" fill="#FFFFFF" stroke="#438BD8" stroke-width="2"/>
    <circle cx="460" cy="210" r="8" fill="#FFFFFF" stroke="#438BD8" stroke-width="2"/>
    <circle cx="560" cy="240" r="8" fill="#FFFFFF" stroke="#04275F" stroke-width="2"/>
  </g>

  <!-- Links -->
  <g stroke="#2D63BD" stroke-width="1.5" opacity="0.7">
    <path d="M88 90 H192"/>
    <path d="M208 74 L310 116"/>
    <path d="M330 120 L432 74"/>
    <path d="M448 74 L552 98"/>
    <path d="M88 94 L154 194"/>
    <path d="M320 130 L306 222"/>
    <path d="M328 126 L452 206"/>
    <path d="M468 214 L552 238"/>
    <path d="M168 200 H292"/>
    <path d="M308 230 H452"/>
  </g>

  <!-- Labels -->
  <text x="60" y="60" fill="#04275F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AWS</text>
  <text x="184" y="52" fill="#04275F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AZURE</text>
  <text x="292" y="100" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">K8S</text>
  <text x="420" y="52" fill="#04275F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CI/CD</text>
  <text x="520" y="80" fill="#04275F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">GITOPS</text>
  <text x="130" y="230" fill="#5F6B7A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SECURITY</text>
  <text x="270" y="260" fill="#5F6B7A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">OBSERVABILITY</text>
  <text x="520" y="270" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">HEALTHY</text>

  <circle cx="320" cy="120" r="16" fill="#F26A13" fill-opacity="0.15">
    <animate attributeName="r" values="14;20;14" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
